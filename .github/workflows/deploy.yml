# Build, publish public GHCR image, pull on VPS, swap this service only, prune old.
# Frontend push never recreates sso-backend (compose --no-deps + this workflow only).
# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images
# https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry

name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sso-backend-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVICE: sso-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="${IMAGE_NAME#*/}"
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${pkg}/visibility" \
            -f visibility=public \
            || echo "If this fails, set the package public once in GitHub: Packages → $pkg → Package settings → Change visibility → Public"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ env.SERVICE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,IMAGE_TAG,SERVICE
          script_stop: true
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /srv/docker/apps/sso
            export SSO_BACKEND_IMAGE="$IMAGE"
            export SSO_BACKEND_TAG="$IMAGE_TAG"

            docker compose pull "$SERVICE"

            OLD_IMAGE_ID="$(docker inspect -f '{{.Image}}' "$SERVICE" 2>/dev/null || true)"

            docker compose up -d --no-deps --pull never --wait --force-recreate "$SERVICE"

            NEW_IMAGE_ID="$(docker inspect -f '{{.Image}}' "$SERVICE")"
            if [ -n "$OLD_IMAGE_ID" ] && [ "$OLD_IMAGE_ID" != "$NEW_IMAGE_ID" ]; then
              docker rmi "$OLD_IMAGE_ID" || true
            fi
            docker image prune -f

      - name: Delete untagged GHCR versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: sso-backend
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true

      - name: Keep last 3 tagged GHCR versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: sso-backend
          package-type: container
          min-versions-to-keep: 3
